[package]
name = "leonida-launcher"
version = "0.1.0"
edition = "2021"
description = "Builds, mods and starts the port"
license = "GPL-3.0-only"
publish = false

[features]
# Draws every screen with made-up data to PNG files (LEONIDA_SHOTS=<dir>), for design review. Never in a release.
shots = []

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

# macOS: `cargo install cargo-bundle && cargo bundle --release` makes the .app with the icon.
[package.metadata.bundle]
name = "Leonida"
identifier = "org.leonida.launcher"
icon = ["../assets/logo.png"]
