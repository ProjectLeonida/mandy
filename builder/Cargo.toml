[package]
name = "leonida-builder"
version = "0.1.0"
edition = "2021"
description = "Desktop front end for make_game.py"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# macOS: `cargo install cargo-bundle && cargo bundle --release` makes Leonida.app with the icon.
[package.metadata.bundle]
name = "Leonida Builder"
identifier = "org.leonida.builder"
icon = ["../assets/logo.png"]
