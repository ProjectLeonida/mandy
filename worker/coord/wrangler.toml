name = "leonida-coord"
main = "src/index.js"
compatibility_date = "2026-11-01"

# One Durable Object holds the whole board, so a claim and the check before it see the same state.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# Set the shared key with:  npx wrangler secret put COORD_TOKEN
